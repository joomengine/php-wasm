name: Runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.catalog.outputs.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Test verified source downloads and recovery
        run: npm run test:build
      - id: catalog
        run: echo "php=$(node scripts/catalog.mjs matrix)" >> "$GITHUB_OUTPUT"

  engine:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.validate.outputs.php) }}
    env:
      PHP_WASM_VERSION: ${{ matrix.php }}
      PHP_WASM_MANIFEST: dist/runtime-manifest.json
      PHP_WASM_BROWSERS: chromium,firefox
      SOURCE_DATE_EPOCH: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y build-essential autoconf automake libtool pkg-config bison re2c cmake ninja-build jq curl xz-utils unzip
      - run: npm ci --ignore-scripts
      - name: Build PHP and native dependencies
        shell: bash
        run: |
          bash build/setup-emsdk.sh "$RUNNER_TEMP/emsdk"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash build/build.sh "$PHP_WASM_VERSION"
          node scripts/manifest.mjs --php "$PHP_WASM_VERSION"
      - name: Exercise real PHP in Node.js
        run: npm run test:integration
      - name: Prepare verified MariaDB bridge release
        run: npm run prepare:mariadb
      - name: Exercise PHP PDO against real MariaDB WASM in Node.js
        run: npm run test:database
      # ubuntu-24.04 includes Chrome/Firefox system libraries. Playwright still
      # validates them when launching; download only the pinned browser binaries.
      - name: Install browser test binaries
        run: npx playwright install --only-shell chromium firefox
      - name: Exercise real PHP in Chromium and Firefox
        run: npm run test:browser
      - name: Exercise PHP PDO against real MariaDB WASM in Chromium and Firefox
        run: npm run test:database:browser
      - name: Record tested artifact hashes
        run: node scripts/test-receipt.mjs "$PHP_WASM_VERSION"
      - name: Retain tested engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-${{ matrix.php }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  package:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php-*
          path: dist
          merge-multiple: true
      - name: Verify test receipts and package release
        run: npm run release:package
      - name: Verify standalone archive in Node.js
        run: node scripts/smoke-release.mjs
      - name: Retain verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

